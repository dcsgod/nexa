[project]
name = "nexa-ai"
version = "0.1.0"
description = "Nexa Python AI engine — profiling, embeddings, graph ML, semantic matching, explainability"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy ML deps kept optional so the engine boots without them in mock mode.
ml = [
  "torch>=2.2",
  "torch-geometric>=2.5",
  "scikit-learn>=1.4",
  "mlflow>=2.16",
]
spark = [
  "pyspark>=3.5",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["ai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests/ai"]
